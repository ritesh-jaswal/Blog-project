spring.application.name=Blog-project
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:blog
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.show-sql=true

#Image/File configs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#image file
project.image=images/

#TO GET LOGS RELATED TO SECURITY
logging.level.org.springframework.security=DEBUG

#TO SET USERNAME AND PASSWORD IN PROPERTIES
spring.security.user.name=rj
spring.security.user.password=rj123
spring.security.user.roles=ADMIN